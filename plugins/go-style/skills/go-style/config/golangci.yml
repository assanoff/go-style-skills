# golangci-lint v2 config of the go-style skills. Needs golangci-lint v2.14+:
# older releases reject some of the settings below or do not support Go 1.27.
#
# Every check enabled here backs a rule of one of the style guides: the rule
# catalogs (../rules/<guide>/*.md) name it in their `lint=` keys, and
# scripts/gostyle.py uses those keys to attach the guide link to each issue.
# Issues that map to no rule of the guides under review are dropped, so adding a
# check here without a catalog key has no visible effect.
#
# The skills pass this file with --config; it does not replace a project's own
# .golangci.yml. Checks are tuned to the guides, not to taste — the reason for
# each non-default setting is next to it.
version: "2"

run:
  # Paths in the JSON output are relative to the go.mod directory, which is
  # where gostyle.py runs golangci-lint.
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - containedctx
    - contextcheck
    - depguard
    - dupl
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - errorlint
    - exptostd
    - forbidigo
    - forcetypeassert
    - funcorder
    - gocognit
    - gocritic
    - godoclint
    - godot
    - goprintffuncname
    - govet
    - iface
    - interfacebloat
    - lll
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnil
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - thelper
    - unused
    - usetesting

  settings:
    depguard:
      rules:
        # google-decisions#use-package-testing: tests use the testing package
        # (plus cmp), not assertion libraries or test frameworks.
        test-frameworks:
          list-mode: lax
          files: ["$test"]
          deny:
            - pkg: github.com/stretchr/testify/assert
              desc: assertion library; use t.Errorf with got/want and cmp.Diff
            - pkg: github.com/stretchr/testify/require
              desc: assertion library; use t.Fatalf with got/want and cmp.Diff
            - pkg: github.com/stretchr/testify/suite
              desc: test framework; use the testing package
            - pkg: github.com/onsi/gomega
              desc: assertion library; use the testing package and cmp
            - pkg: github.com/onsi/ginkgo
              desc: test framework; use the testing package
            - pkg: gopkg.in/check.v1
              desc: test framework; use the testing package
            - pkg: github.com/smartystreets/goconvey
              desc: test framework; use the testing package
            - pkg: github.com/frankban/quicktest
              desc: assertion library; use the testing package and cmp
            - pkg: github.com/matryer/is
              desc: assertion library; use the testing package and cmp
            - pkg: gotest.tools
              desc: assertion library; use the testing package and cmp
        # google-decisions#types-of-equality: cmp is for tests; it may panic.
        # Test-helper packages are exempt by path.
        cmp-in-production:
          list-mode: lax
          files:
            - "!$test"
            - "!**/*test*/**"
            - "!**/testutil*/**"
          deny:
            - pkg: github.com/google/go-cmp
              desc: cmp is meant for tests and may panic; compare explicitly in production code

    dupl:
      # A hint for google-guide#concision (repetition hides the differences);
      # test files are excluded below, table tests repeat by design.
      threshold: 150

    embeddedstructfieldcheck:
      # uber#embedding-in-structs: embedded fields at the top, then a blank line.
      empty-line: true
      # uber#zero-value-mutexes-are-valid: never embed sync.Mutex / RWMutex.
      forbid-mutex: true

    errcheck:
      # google-decisions#handle-errors, effective#blank_assign: an error dropped
      # into `_` is no better than one that is not checked.
      check-blank: true
      # Writers that are documented never to fail (the guides' own exception).
      exclude-functions:
        - io.WriteString(*bytes.Buffer)
        - io.WriteString(*strings.Builder)
        - io.WriteString(hash.Hash)
        - io.WriteString(hash.Hash32)
        - io.WriteString(hash.Hash64)

    errorlint:
      # Only the checks of how an error is matched. `%w` or `%v` in fmt.Errorf
      # is a choice both Google and Uber leave to the author.
      errorf: false

    forbidigo:
      analyze-types: true
      forbid:
        # google-decisions#types-of-equality; limited to tests by the exclusion
        # rule below.
        - pattern: ^reflect\.DeepEqual$
          msg: compare with cmp.Equal or cmp.Diff instead of reflect.DeepEqual

    funcorder:
      # uber#function-grouping-and-ordering.
      constructor: true
      struct-method: true

    gocognit:
      # A hotspot hint for google-guide#simplicity, not a hard limit. At the
      # linter's default of 30 a flat run of `if x != "" { print }` blocks is
      # reported, which the guide calls easy to read.
      min-complexity: 50

    gocritic:
      disable-all: true
      enabled-checks:
        - boolExprSimplify
        - captLocal
        - docStub
        - exitAfterDefer
        - ifElseChain
        - importShadow
        - nestingReduce
        - preferFprint
        - ptrToRefParam
        - sloppyReassign
        - sprintfQuotedString
        - stringConcatSimplify
        - typeDefFirst
        - typeSwitchVar
        - yodaStyleExpr
      settings:
        captLocal:
          # Local variables too, not only parameters (google-guide#mixed-caps).
          paramsOnly: false

    godoclint:
      # revive's exported and package-comments rules cover the doc comment
      # form; godoclint adds the one-package-comment-per-package check.
      default: none
      enable:
        - single-pkg-doc

    godot:
      # google-decisions#comment-sentences: doc comments are full sentences.
      scope: declarations
      # A comment whose last line is one of these is left alone: a sentence
      # ending inside a quotation, a TODO, a list item.
      exclude:
        - '[.!?]"$'
        - '^\s*TODO'
        - '^\s*(-|\*|\d+[.)])\s'

    iface:
      enable:
        # Not `unused`: an interface nobody uses inside its package is, when
        # exported, the protocol the package offers, which the guides endorse,
        # and when unexported, dead code that the unused linter reports.
        - identical
        - opaque
        - unusedmethod

    lll:
      # uber#avoid-overly-long-lines (soft limit 99). Google sets no limit, so
      # these findings are dropped in multi-guide runs.
      line-length: 99
      tab-width: 4

    modernize:
      # Only atomictypes backs a rule (uber#use-gouberorgatomic, superseded by
      # the typed values of sync/atomic).
      disable:
        - any
        - embedlit
        - errorsastype
        - forvar
        - importcomment
        - mapsloop
        - minmax
        - newexpr
        - omitzero
        - plusbuild
        - rangeint
        - reflecttypeassert
        - reflecttypefor
        - slicesbackward
        - slicesclip
        - slicescontains
        - slicessort
        - stditerators
        - stringsbuilder
        - stringscut
        - stringscutprefix
        - stringsseq
        - testingcontext
        - unsafefuncs
        - waitgroupgo

    nakedret:
      # google-decisions#named-result-parameters: naked returns only in
      # functions of a handful of lines.
      max-func-lines: 8

    nilnil:
      # google-decisions#in-band-errors. Not maps: a nil map is a valid empty
      # value, as a nil slice is.
      checked-types: [ptr, func, iface, chan, uintptr, unsafeptr]

    reassign:
      # uber#avoid-mutable-globals: any variable of another package, not only
      # its errors.
      patterns:
        - ".*"

    revive:
      rules:
        - name: argument-limit
          arguments: [6]
        - name: blank-imports
        - name: confusing-results
        - name: context-as-argument
        - name: deep-exit
        - name: defer
          # effective#recover: only `defer recover()`, which recovers nothing.
          # The recover option also reports recover in a named function that is
          # itself deferred, which works; call-chain would flag the
          # deferred-trace idiom Effective Go recommends.
          arguments:
            - [immediate-recover]
        - name: dot-imports
        - name: early-return
        - name: enforce-map-style
          arguments: [make]
        - name: enforce-slice-style
          arguments: [nil]
        - name: error-return
        - name: exported
        - name: file-length-limit
          # google-practices#package-size: "many thousands of lines" in a file.
          arguments:
            - max: 3000
              skip-comments: true
              skip-blank-lines: true
        - name: import-alias-naming
        - name: indent-error-flow
        - name: package-comments
        - name: package-directory-mismatch
        - name: package-naming
          # google-decisions#package-names lists util, utility, common, helper,
          # model, testhelper; revive's default list covers util(s), common,
          # misc, types, interfaces. Its "extra" list adds api, which Google
          # does not object to, so the rest is named here instead.
          arguments:
            - user-defined-bad-names:
                - utility
                - utilities
                - helper
                - helpers
                - model
                - models
                - testhelper
                - testhelpers
        - name: range
        - name: receiver-naming
          # google-decisions#receiver-names: "usually one or two letters".
          arguments:
            - max-length: 3
        - name: redundant-import-alias
        - name: string-format
          # google-practices#error-extra-info, uber#error-wrapping: a wrap adds
          # what the caller does not know yet, without stop words, or the error
          # is returned as it is.
          arguments:
            - - fmt.Errorf[0]
              - "!/^(?i:failed to|unable to|could not|couldn't) .*: %[wv]$/"
              - 'stop words in a wrapped error: say what was being done ("open config: %w")'
            - - fmt.Errorf[0]
              - '!/^((failed|error): )?%[wv]$/'
              - the wrap adds nothing; add context or return the error as it is
        - name: superfluous-else
        - name: time-equal
        - name: unnecessary-format
        - name: unnecessary-if
        - name: use-any
        - name: useless-break
        - name: useless-fallthrough
        - name: var-declaration
        - name: var-naming
          # google-decisions#initialisms lists DB, which revive's own list of
          # initialisms lacks: an allow list (empty), then a block list.
          arguments:
            - []
            - [DB]

    staticcheck:
      checks:
        - S1007
        - S1009
        - S1011
        - S1019
        - S1023
        - S1028
        - S1033
        - S1031
        - S1034
        - SA2002
        - SA4005
        - SA4010
        - SA4011
        - SA5000
        - SA5001
        - ST1005
        # Receiver names consistent across the files of a package (revive only
        # compares within a file).
        - ST1016
        - ST1017

    thelper:
      # google-decisions#mark-test-helpers asks for t.Helper() and t first; the
      # parameter name is not a guide rule.
      test: {first: true, name: false, begin: true}
      benchmark: {first: true, name: false, begin: true}
      tb: {first: true, name: false, begin: true}
      fuzz: {first: true, name: false, begin: true}

    usetesting:
      # google-decisions#contexts: tests take their context from t.Context().
      context-background: true
      context-todo: true

  exclusions:
    generated: strict
    # Unchecked Close/Flush/print/os.Remove/os.Setenv results: deferred Close on
    # a read-only file or response body is accepted practice in every guide.
    presets:
      - std-error-handling
    rules:
      - path-except: _test\.go$
        linters: [forbidigo]
        text: DeepEqual
      # Table tests and subtests repeat by design and inflate complexity scores.
      - path: _test\.go$
        linters: [dupl, gocognit]
      # A failed type assertion in a test panics and fails the test, which is
      # what the test wants; the guides ask for comma-ok where code must go on.
      - path: _test\.go$
        linters: [forcetypeassert]
      # A function a test passes to t.Run or calls as its body is not a
      # helper, and t.Helper() there would hide the line that failed.
      - linters: [thelper]
        source: '^func test[A-Z]'
      # Fakes and table tests implement signatures and hold fixtures the guides'
      # rules for production code do not mean: a nil, nil stub, a case struct
      # with a context.
      - path: _test\.go$
        linters: [nilnil, containedctx]
      # uber#performance applies to the hot path, which a test is not.
      - path: _test\.go$
        linters: [prealloc]
      - path: _test\.go$
        linters: [perfsprint]
        text: strconv|hex\.Encode
      # uber#avoid-overly-long-lines is about code: a URL, a struct tag or a
      # long string literal cannot be wrapped.
      - linters: [lll]
        source: 'https?://|`\w+:"|"[^"]{60,}"'
      # The deferred-wrap idiom, func Wrap(errp *error, ...), writes through
      # its pointer.
      - linters: [gocritic]
        text: ptrToRefParam
        source: '\*error\b'
      # decisions#doc-comments lets an article precede the name in any doc
      # comment; revive accepts it for types only.
      - linters: [revive]
        text: should be of the form
        source: '^\s*//\s*(A|An|The)\s'
      # best-practices#shadowing names standard packages; a local variable
      # may well share its name with a package of the module.
      - linters: [gocritic]
        text: 'importShadow: shadow of imported from'
      # A method nobody calls inside the package: on an exported interface that
      # is the protocol the package offers. An interface over one unexported
      # type: encapsulation, which the guides accept.
      - linters: [iface]
        text: "unusedmethod: .* on interface '[A-Z]"
      - linters: [iface]
        text: "opaque: .* implementation of '\\*?[a-z]"
      # Setting flag.Usage is how the flag package is meant to be used.
      - linters: [reassign]
        text: Usage in other package flag
      # decisions#handle-errors accepts a discarded error that a comment
      # explains; the comment is taken to be on the same line.
      - linters: [errcheck]
        source: '\b_\s*(,\s*\w+\s*)*:?=[^=].*[^:"]//'
      # decisions#nil-slices prefers nil for a slice variable that is declared
      # empty, uber#nil-is-a-valid-slice for one that is returned. revive also
      # reports an empty slice written as a struct field, a call argument, an
      # element or an assignment to a field, where the guides have no
      # preference.
      - linters: [revive]
        text: enforce-slice-style
        source: '(:\s+|[,{(]\s*|^\s*)&?\[\]\S*\{\}|(:\s+|[,{]\s*)make\(\[\]|\.\w+\s*=\s*(\[\]|make\()'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      # google-guide#formatting requires gofmt output; `gofmt -s` rewrites are
      # simplifications (revive's range rule covers the common one), not a must.
      simplify: false

issues:
  # Report everything: the skills group and collapse findings in the report.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
